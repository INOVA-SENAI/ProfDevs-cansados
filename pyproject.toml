[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "senai-slides"
version = "0.5.0"
description = "Gera apresentações .pptx no padrão visual do SENAI 2026 a partir de um deck em YAML."
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "lxml>=5.0",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "boto3[crt]>=1.41",  # [crt] permite usar o login do `aws login`
    "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["senai_slides"]

[tool.setuptools.package-data]
senai_slides = ["assets/*.png", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
