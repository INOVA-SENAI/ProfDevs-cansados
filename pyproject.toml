[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "senai-slides"
version = "0.3.0"
description = "Gera slides no padrão visual do SENAI 2026 a partir de um deck em YAML."
requires-python = ">=3.10"
dependencies = ["pillow>=11.0", "pyyaml>=6.0"]

[tool.setuptools]
packages = ["senai_slides"]

[tool.setuptools.package-data]
senai_slides = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
